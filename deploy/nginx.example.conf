# 负载均衡示例——加一台 Mac 只需在对应 upstream 里加一行 server，再 nginx -s reload。
#
# 形态 A：Mac 当「模型节点」(mlx_lm.server, OpenAI 兼容, 端口 8080)，app 层 ARK_BACKEND=api
#         指向 http://<本LB>/v1 。
upstream mlx_model_pool {
    least_conn;                       # 按连接数挑最闲的节点
    server 192.168.1.11:8080;         # mac #1
    server 192.168.1.12:8080;         # mac #2
    # server 192.168.1.13:8080;       # ← 加一台 Mac：加这一行，然后 nginx -s reload
}

# 形态 B：每台 Mac 跑完整 app (uvicorn, 端口 8000)，状态共享在 Redis
upstream ark_app_pool {
    least_conn;
    server 192.168.1.21:8000 max_fails=2 fail_timeout=10s;
    server 192.168.1.22:8000 max_fails=2 fail_timeout=10s;
    # server 192.168.1.23:8000;       # ← 加一台 Mac：加这一行 + reload
}

server {
    listen 80;

    # 形态 A：模型池（给 app 层调用）
    location /v1/ {
        proxy_pass http://mlx_model_pool;
        proxy_read_timeout 120s;       # 生成可能较久
    }

    # 形态 B：app 池（直接给玩家）
    location / {
        proxy_pass http://ark_app_pool;
        proxy_read_timeout 120s;
        # 就绪探针：未 ready 的实例不分流（配合主动健康检查模块更佳）
    }
}
