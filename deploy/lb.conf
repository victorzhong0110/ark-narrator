# compose-prod 的 nginx 负载均衡：把流量分到所有 app 副本（docker DNS 轮询）。
events {}
http {
  resolver 127.0.0.11 valid=10s ipv6=off;   # docker 内置 DNS，动态发现 app 副本
  client_max_body_size 128k;                 # 边缘硬上限,不依赖 Content-Length(防超大/畸形体)
  server {
    listen 80;
    proxy_read_timeout 120s;
    proxy_next_upstream error timeout http_502 http_503;  # 某副本挂了转下一个
    location / {
      set $up app:8000;                       # 用变量强制每次重新解析（含新副本）
      proxy_pass http://$up;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
