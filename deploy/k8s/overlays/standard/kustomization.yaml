apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ark-standard

resources:
  - ../../base

replicas:
  - name: ark-app
    count: 3

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: ark-app
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 12
  - target:
      kind: ConfigMap
      name: ark-config
    patch: |-
      - op: add
        path: /data/ARK_MAX_TOKENS
        value: "320"
