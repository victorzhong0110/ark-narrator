apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ark-flagship

resources:
  - ../../base

replicas:
  - name: ark-app
    count: 6

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: ark-app
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 6
      - op: replace
        path: /spec/maxReplicas
        value: 24
  - target:
      kind: ConfigMap
      name: ark-config
    patch: |-
      - op: add
        path: /data/ARK_MAX_TOKENS
        value: "400"
      - op: add
        path: /data/ARK_RAG_TOP_K
        value: "4"
      - op: replace
        path: /data/ARK_CLOUD_AUDIT_PROVIDER
        value: "aliyun"
