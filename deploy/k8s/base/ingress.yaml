apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ark-app
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  rules:
    - host: ark.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ark-app
                port:
                  number: 80
