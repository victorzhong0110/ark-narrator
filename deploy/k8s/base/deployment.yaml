apiVersion: apps/v1
kind: Deployment
metadata:
  name: ark-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ark-narrator
      component: app
  template:
    metadata:
      labels:
        app: ark-narrator
        component: app
    spec:
      containers:
        - name: app
          image: ghcr.io/victorzhong0110/ark-narrator:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ark-config
            - secretRef:
                name: ark-secrets
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
