# 模板占位——生产用 External Secrets / Vault 注入，勿把真值提交进库。
# 注意：REPLACE_ME 是占位符，应用启动会检测并拒绝启动（fail-closed），必须替换为真实值。
apiVersion: v1
kind: Secret
metadata:
  name: ark-secrets
type: Opaque
stringData:
  ARK_JWT_SECRET: "REPLACE_ME"          # jwt 鉴权 HS256 密钥（≥16 字符，与游戏鉴权服务共享）
  ARK_API_KEY: "REPLACE_ME"
  ARK_API_AUTH_KEY: "REPLACE_ME"
  ARK_CLOUD_AUDIT_KEY: "REPLACE_ME"
  ARK_API_BASE_URL: "http://your-inference-service/v1"
  ARK_CLOUD_AUDIT_ENDPOINT: "https://your-audit-gateway/audit"
