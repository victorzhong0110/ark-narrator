# 单主机「一键起全栈」（standard 档）：nginx LB → 可扩 app 副本 → 共享 Redis。
#
#   docker compose -f deploy/compose-prod.yml up -d --scale app=3        # 基础（Redis 持久化）
#   docker compose -f deploy/compose-prod.yml --profile ha up -d --scale app=3   # + Redis Sentinel HA
#   docker compose -f deploy/compose-prod.yml --profile gateway up -d    # + 推理网关（控制面/计算面分离）
#
# 默认 app 用 scripted 后端，便于无 GPU 本地验证整套 IaC/HA 链路；真模型把 ARK_BACKEND 改为
# api/pool 并指向你的推理服务（Mac 机队或 vLLM）。机密放 deploy/.env（gitignore），不入 compose。
#
# 分离拓扑（gateway profile）：deploy/.env 设 ARK_BACKEND=api、ARK_API_BASE_URL=http://gateway:8080/v1、
# ARK_API_KEY=<网关token>、GW_TOKENS=<同一token>，app 即经网关访问内部机队/外部 API。详见 docs/GATEWAY.md。
name: ark-narrator-prod

services:
  redis:                                   # master，开 AOF 持久化（消除「重启丢状态」）
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis-replica:                           # 副本（HA），ha profile 才起
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--replicaof", "redis", "6379"]
    depends_on: [redis]
    profiles: ["ha"]
    restart: unless-stopped

  sentinel:                                # 哨兵 x3（HA），主挂自动切换
    image: redis:7-alpine
    command: ["redis-sentinel", "/etc/redis/sentinel.conf"]
    volumes: ["./redis/sentinel.conf:/etc/redis/sentinel.conf"]
    depends_on: [redis, redis-replica]
    deploy:
      replicas: 3
    profiles: ["ha"]
    restart: unless-stopped

  app:                                     # 可横向扩展（--scale app=N），无状态，状态在 Redis
    build: ..
    env_file:
      - path: .env                         # 机密放这里（gitignore），缺省也能起
        required: false
    environment:
      ARK_BACKEND: ${ARK_BACKEND:-scripted}
      ARK_STORE: redis
      ARK_REDIS_URL: redis://redis:6379/0
      # HA 模式下改走 Sentinel（覆盖上面的 url）：
      ARK_REDIS_SENTINELS: ${ARK_REDIS_SENTINELS:-}
      ARK_REDIS_MASTER: mymaster
      ARK_SCENE_TAGGER: ${ARK_SCENE_TAGGER:-heuristic}
      ARK_CLOUD_AUDIT: ${ARK_CLOUD_AUDIT:-true}
      ARK_CLOUD_AUDIT_PROVIDER: ${ARK_CLOUD_AUDIT_PROVIDER:-mock}
      ARK_API_AUTH_KEY: ${ARK_API_AUTH_KEY:-}
      ARK_MAX_CONCURRENCY: ${ARK_MAX_CONCURRENCY:-8}
      # 分离拓扑：ARK_BACKEND=api 时指向 gateway；内部消费者用独立 token 分账
      ARK_API_BASE_URL: ${ARK_API_BASE_URL:-}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_INTERNAL_API_KEY: ${ARK_INTERNAL_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    expose: ["8000"]
    restart: unless-stopped

  gateway:                                 # 推理网关（计算面，profile gateway）：token 鉴权 + 路由(内部机队/外部API)
    build: ..
    env_file:
      - path: .env
        required: false
    environment:
      GW_BACKEND: ${GW_BACKEND:-scripted}   # scripted 验链路；真机队改 pool（靠 Redis 服务发现）
      GW_REDIS_URL: redis://redis:6379/0
      GW_NODE_GROUP: ${ARK_NODE_GROUP:-models}
      GW_NODE_ALLOWLIST: ${GW_NODE_ALLOWLIST:-}
      GW_PORT: "8080"
      GW_TOKENS: ${GW_TOKENS:-}             # 逗号分隔；或挂载 gateway/tokens.yaml 做细策略
      GW_EXTERNAL_BASE_URL: ${GW_EXTERNAL_BASE_URL:-}   # 外部 API 兜底/分流（留空=纯内部）
      GW_EXTERNAL_KEY: ${GW_EXTERNAL_KEY:-}
      GW_EXTERNAL_MODEL: ${GW_EXTERNAL_MODEL:-}
      GW_ROUTE_DEFAULT: ${GW_ROUTE_DEFAULT:-pool}
      GW_ROUTE_FALLBACK: ${GW_ROUTE_FALLBACK:-external}
      GW_EXTERNAL_SPLIT: ${GW_EXTERNAL_SPLIT:-0}
      GW_ROUTE_TABLE: ${GW_ROUTE_TABLE:-}
      GW_ALLOW_ANON: ${GW_ALLOW_ANON:-}    # 留空=无token拒绝启动(fail-closed)；仅 dev 可设 true
    command: ["python", "-m", "gateway.app"]
    depends_on:
      redis:
        condition: service_healthy
    expose: ["8080"]                        # 仅内网(控制面经 docker 网络访问)；不发布到主机，
    # 绝不对外暴露裸模型网关。若确需对外，必须前置鉴权代理。调试可临时加 ports: ["127.0.0.1:8080:8080"]
    profiles: ["gateway"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  lb:                                      # nginx：对 app 副本做负载均衡
    image: nginx:alpine
    volumes: ["./lb.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8000:80"]
    depends_on: [app]
    restart: unless-stopped

  prometheus:                              # 抓取所有 app 副本的 /metrics（monitoring profile）
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    profiles: ["monitoring"]
    restart: unless-stopped

  grafana:                                 # 自带预置数据源 + 仪表盘
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    profiles: ["monitoring"]
    restart: unless-stopped

  jaeger:                                  # 链路追踪后端（OTLP）。app 设 ARK_OTEL_ENDPOINT 指过来
    image: jaegertracing/all-in-one:latest
    ports: ["16686:16686", "4318:4318"]
    profiles: ["monitoring"]
    restart: unless-stopped

volumes:
  redis-data:
